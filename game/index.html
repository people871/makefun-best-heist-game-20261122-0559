<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight Vault — a top-down heist stealth game</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0c12; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #selftest { position: absolute; left: 8px; top: 8px; z-index: 2; margin: 0; padding: 10px 12px; background: rgba(10, 12, 18, 0.92); color: #eef1f5; font: 13px/1.5 ui-monospace, monospace; white-space: pre-wrap; max-width: 640px; max-height: 90vh; overflow: auto; }
</style>
</head>
<body>
<canvas id="game" aria-label="Midnight Vault: sneak past the guards and cameras, crack the vault, and reach the exit"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
